name: scrape

on:
  workflow_dispatch:
    inputs:
      site:
        description: "site to scrape"
        default: "halfclub"

jobs:
  run:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.62.0-noble
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: python main.py ${{ inputs.site }}
